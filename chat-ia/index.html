<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- Título (topo do desenho) -->
    <header class="titulo">
      <h1>Meu Chat</h1>
    </header>

    <div class="corpo">

      <!-- Lateral: Key + Conversas -->
      <aside class="lateral">
        <label class="campo-chave">
          <span>Key</span>
          <input id="chave" type="password" placeholder="cole sua chave" autocomplete="off">
        </label>

        <h2>Conversas</h2>
        <ul id="lista-conversas" class="lista-conversas"></ul>

        <button id="btn-nova" class="btn-nova" type="button">+ Nova conversa</button>
      </aside>

      <!-- Área principal: mensagens (com rolagem) + caixa de texto -->
      <section class="principal">
        <div id="mensagens" class="mensagens" aria-live="polite"></div>

        <form id="form" class="entrada" autocomplete="off">
          <textarea id="texto" rows="1" placeholder="Digite sua mensagem..."></textarea>
          <button id="btn-enviar" type="submit" aria-label="Enviar">➤</button>
        </form>
      </section>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
